name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Could not detect active Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Active Java version is $JAVA_VER, but version 17 or newer is required."
            exit 1
          fi
          echo "Java environment verification passed."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Keystore ./debug.keystore already exists."
          else
            echo "Generating ./debug.keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH"
            echo "Discovered APKs inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" 2>/dev/null || echo "None found"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected APK at $APK_PATH is empty (0 bytes)."
            exit 1
          fi
          echo "APK verification successful: $APK_PATH ($(stat -c%s "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_ASSET_DIR/app-debug.apk"
          if [ ! -s "$TEMP_ASSET_DIR/app-debug.apk" ]; then
            echo "ERROR: Failed to prepare APK release asset."
            exit 1
          fi
          echo "Prepared asset at: $TEMP_ASSET_DIR/app-debug.apk"
          echo "asset_path=$TEMP_ASSET_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_FILE: ${{ steps.prepare_asset.outputs.asset_path }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh --version || { echo "ERROR: GitHub CLI is not available"; exit 1; }
          if [ ! -s "$ASSET_FILE" ]; then
            echo "ERROR: Release asset does not exist or is empty."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${RUN_NUMBER}"
          RELEASE_NOTES=$(printf '%s\n' \
            "### Automated Debug Build #${RUN_NUMBER}" \
            "" \
            "- **Type**: Automatically generated debug APK" \
            "- **Builder**: GitHub Actions" \
            "- **Run Number**: ${RUN_NUMBER}" \
            "- **Run Attempt**: ${RUN_ATTEMPT}" \
            "- **Commit SHA**: \`${COMMIT_SHA}\`" \
            "- **Intended Use**: Testing and review" \
            "- **Note**: Signed only with a temporary debug keystore. Not a Play Store release.")

          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --target "$COMMIT_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
            gh release view "$RELEASE_TAG"
            DIRECT_DOWNLOAD_URL="https://github.com/${REPO}/releases/latest/download/app-debug.apk"
            echo "Release Page: https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
            echo "Direct APK URL: $DIRECT_DOWNLOAD_URL"
            {
              echo "### DIRECT APK DOWNLOAD"
              echo "[Download app-debug.apk]($DIRECT_DOWNLOAD_URL)"
              echo ""
              echo "The Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not succeed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and artifact 'app-debug-apk' remains available."
            fi
          fi
